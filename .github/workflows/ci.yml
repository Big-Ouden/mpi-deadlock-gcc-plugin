name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  GCC_ROOT: /opt/gcc-12.2.0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/big-ouden/gcc12-mpi:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCC 12.2.0 environment
        run: |
          echo "$GCC_ROOT/bin" >> $GITHUB_PATH
          echo "CC=$GCC_ROOT/bin/gcc"  >> $GITHUB_ENV
          echo "CXX=$GCC_ROOT/bin/g++" >> $GITHUB_ENV

      - name: Build plugin (libplugin.so)
        run: make

      # `make check` compiles every test and fails if a test-fail-* file does
      # not warn or a test-pass-* file warns. MPICC is the compiler wrapper
      # used for the test programs (it resolves mpi.h and links libmpi).
      - name: Check tests (fail tests warn, pass tests do not)
        run: make check MPICC=mpicc
