name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The flake pins GCC 12.2.0, OpenMPI and Graphviz, so no container image
      # is needed.
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # `nix build` also runs the test suite (the package checkPhase)
      - name: Build plugin (libplugin.so)
        run: nix build --print-build-logs

      # `make check` compiles every test and fails if a test-fail-* file does
      # not warn or a test-pass-* file warns.
      - name: Check tests (fail tests warn, pass tests do not)
        run: nix develop --command make check MPICC=mpicc
